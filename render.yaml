# ReplyIQ — Render Blueprint
#
# Provisions the whole product: PostgreSQL, the NestJS API, and the React
# dashboard as a static site. Point Render at this file (New → Blueprint) and it
# creates all three and wires them to each other.
#
# ── Why pnpm is installed from npm rather than via corepack ───────────────────
# `corepack enable` resolves the version pinned in package.json and verifies its
# signature. The corepack bundled with Node 22 predates pnpm 11 and commonly
# fails that check in CI ("Cannot find matching keyid"), surfacing as an
# unexplained build failure. Installing the pinned version directly from npm is
# deterministic and has no signature step to go wrong.
#
# ── Why the native Node runtime rather than Docker ────────────────────────────
# A Dockerfile for a pnpm workspace has to reproduce the symlinked node_modules
# layout and the generated Prisma client across build stages, which is a real
# source of "works locally, fails in the image" problems. Render's Node runtime
# builds from the repo as-is and caches dependencies between deploys, so for a
# first deployment it is both simpler and more reliable. A Dockerfile remains a
# Milestone 8 item for when reproducible local images matter.
#
# ── Free plan, and what it costs you ──────────────────────────────────────────
#   * The web service sleeps after ~15 minutes idle and cold-starts in ~50s.
#   * Free PostgreSQL EXPIRES 30 DAYS after creation. There is then a 14-day
#     grace period in which upgrading to a paid plan KEEPS your data; after that
#     Render deletes the database and everything in it.
#   * Free databases have NO BACKUPS of any kind. Run scripts/backup-db.sh
#     regularly, or upgrade before you have anything you would miss.
# Upgrading later is a plan change in the dashboard - no code or config change.

databases:
  - name: replyiq-db
    databaseName: replyiq
    user: replyiq
    plan: free
    # Must match the API's region: `connectionString` below is the INTERNAL
    # connection string, and Render's private networking does not cross
    # regions. Leaving this unset defaulted it to Oregon while the API was in
    # Singapore, which would have failed at first connection.
    region: oregon
    postgresMajorVersion: "17"

services:
  # ── API ─────────────────────────────────────────────────────────────────────
  - type: web
    name: replyiq-api
    runtime: node
    plan: free
    # Must match replyiq-db's region (see the note there). Oregon costs ~250ms
    # from India versus ~60ms from Singapore; move both together when the
    # latency matters more than the free plan does.
    region: oregon

    buildCommand: >-
      npm install -g pnpm@11.13.0 &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @replyiq/database exec prisma generate &&
      npx turbo build --filter=@replyiq/api...

    # Migrations run at start rather than in a preDeploy hook, because preDeploy
    # is a paid-plan feature. `migrate deploy` is idempotent and forward-only, so
    # running it on every cold start is safe: it applies nothing when the schema
    # is already current, and it never resets or drops anything.
    #
    # Deliberately uses npx from the database package rather than pnpm: pnpm is
    # installed globally during BUILD, and Render makes no promise that global
    # binaries survive into the runtime environment. A start command that cannot
    # find pnpm fails on boot, and the service simply never comes up.
    startCommand: >-
      (cd packages/database && npx prisma migrate deploy) &&
      node apps/api/dist/src/main.js

    healthCheckPath: /api/v1/health

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: replyiq-db
          property: connectionString

      # Generated once by Render and never shown in this file or in git.
      # Rotating them invalidates every existing session, which is the intended
      # behaviour if one is ever suspected of leaking.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true

      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL
        value: 30d

      # NOT `fromService ... property: host`. That returns the INTERNAL service
      # name ("replyiq-web"), not the public FQDN, so the allow-origin header
      # came back as "https://replyiq-web" and every browser request was
      # blocked by CORS while curl - which sends no Origin - worked fine.
      # The public hostname is deterministic from the service name, so it is
      # written out explicitly. Update both values together if a service is
      # ever renamed.
      - key: CORS_ORIGINS
        value: https://replyiq-web.onrender.com

      - key: RATE_LIMIT_TTL
        value: "60"
      - key: RATE_LIMIT_MAX
        value: "10"
      - key: DOMAIN_RATE_LIMIT_TTL
        value: "3600"
      - key: DOMAIN_ADD_RATE_LIMIT_MAX
        value: "10"
      - key: DOMAIN_VERIFY_RATE_LIMIT_MAX
        value: "20"

      # Left empty on purpose: only IANA-reserved test namespaces are
      # sandbox-eligible unless an operator adds a namespace they control.
      - key: SANDBOX_DOMAIN_SUFFIX
        value: ""

      # MUST stay false. The process refuses to boot if this is "true" while
      # NODE_ENV=production (FR-TEST-10), so a mistake here fails the deploy
      # loudly rather than quietly weakening domain verification forever.
      - key: ALLOW_DEV_VERIFICATION_BYPASS
        value: "false"

  # ── Dashboard ───────────────────────────────────────────────────────────────
  - type: web
    name: replyiq-web
    runtime: static

    # Vite reads VITE_-prefixed variables from the environment at build time, so
    # VITE_API_URL below is baked into the bundle here. It is a literal for the
    # same reason CORS_ORIGINS is: `fromService ... property: host` yields the
    # internal service name, which produced "https://replyiq-api" in the shipped
    # bundle - a host that does not resolve.
    buildCommand: >-
      npm install -g pnpm@11.13.0 &&
      pnpm install --frozen-lockfile &&
      npx turbo build --filter=@replyiq/web...

    staticPublishPath: apps/web/dist

    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://replyiq-api.onrender.com

    routes:
      # Single-page app: every unmatched path must return index.html, or a
      # refresh on /dashboard/domains 404s instead of loading the app.
      - type: rewrite
        source: /*
        destination: /index.html

    headers:
      # The API sets its own headers via Helmet; a static host needs its own.
      - path: /*
        name: X-Frame-Options
        value: SAMEORIGIN
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Strict-Transport-Security
        value: max-age=31536000; includeSubDomains
