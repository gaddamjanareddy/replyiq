<!--
  The ReplyIQ mark: the same gradient square and "RQ" used in the app header
  and the sidebar, so a pinned tab matches the product.

  SVG rather than a .ico: it is a few hundred bytes, stays sharp at any size,
  and needs no build step. Safari and older Edge fall back to nothing rather
  than to a broken image, which is an acceptable trade for not committing a
  binary nobody can review.
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="ReplyIQ">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3b82f6" />
      <stop offset="1" stop-color="#1d4ed8" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#g)" />
  <text
    x="32"
    y="43"
    text-anchor="middle"
    font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif"
    font-size="26"
    font-weight="700"
    fill="#ffffff"
  >RQ</text>
</svg>
