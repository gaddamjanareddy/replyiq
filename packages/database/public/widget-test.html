<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Harbour Dental — widget harness</title>
    <!--
      A deliberately hostile host page. These rules would wreck a widget that
      relied on the page's own styles instead of a shadow root, which is
      exactly why the harness looks like this.
    -->
    <style>
      * { box-sizing: content-box !important; }
      button { width: 100% !important; background: red !important; font-size: 32px !important; }
      div { border: 2px dashed #f0b !important; }
      input { display: none !important; }
      body { font-family: 'Comic Sans MS', cursive; margin: 0; padding: 40px; background: #eef; }
    </style>
  </head>
  <body>
    <h1>Harbour Dental</h1>
    <p>A pretend customer website, with intentionally aggressive global CSS.</p>
    <button>A host page button (should stay red and full width)</button>
    <script src="/widget.js" data-business-id="00000000-0000-0000-0000-0000000000bb" data-api-url="http://localhost:3000" defer></script>
  </body>
</html>
